services:
  - type: web
    name: ai-consultancy-api
    runtime: node
    buildCommand: npm install && VITE_BASE_PATH=/admin VITE_API_URL= npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEBSITE_FORM_SECRET
        value: NSI-WEB-FORM-SECURE-KEY-7k3m9p2qx
      - key: CORS_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

  # Pings the site every 14 min so Render free tier stays awake (reduces 30–60s cold starts)
  - type: cron
    name: website-keepalive
    runtime: node
    schedule: "*/14 * * * *"
    buildCommand: "true"
    startCommand: node scripts/render-keepalive.js
    envVars:
      - key: KEEP_ALIVE_URL
        value: https://www.nextstepinternationals.com/ping
