<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Track your application | NextStep International</title>
  <meta name="description" content="Track your university application status with NextStep International using your Register ID.">
  <link rel="icon" type="image/webp" href="images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="dns-prefetch" href="https://wa.me">
  <style>
    :root {
      --brand: #5b4dff; --brand-2: #06b6d4; --accent: #ec4899;
      --ink: #0c0a1d; --ink-soft: #3d3a52; --muted: #6b6580;
      --bg: #f2f5ff; --surface: #fff; --line: rgba(91,77,255,0.14);
      --danger: #dc2626; --success: #059669; --warn: #d97706;
      --radius: 14px; --radius-sm: 10px;
      --font: "Outfit", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font); font-size: 1rem; line-height: 1.6;
      color: var(--ink-soft); background: var(--bg);
      -webkit-font-smoothing: antialiased; min-height: 100vh;
    }

    /* Header */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 2px 12px rgba(91,77,255,0.07);
    }
    .header-inner {
      max-width: 700px; margin: 0 auto;
      padding: 12px max(16px, env(safe-area-inset-left)) 12px max(16px, env(safe-area-inset-right));
      display: flex; align-items: center; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
    .brand img { width: 36px; height: 36px; border-radius: 8px; object-fit: contain; box-shadow: 0 2px 10px rgba(91,77,255,0.2); }
    .brand-name { font-weight: 800; font-size: 1rem; letter-spacing: -0.02em; color: var(--ink); }
    .header-back {
      margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.875rem; font-weight: 600; color: var(--brand);
      text-decoration: none; padding: 7px 12px; border-radius: 8px;
      background: rgba(91,77,255,0.08); transition: background 0.15s;
    }
    .header-back:hover { background: rgba(91,77,255,0.14); }
    .header-back svg { width: 14px; height: 14px; }

    /* Page */
    .page-wrap {
      max-width: 700px; margin: 0 auto;
      padding: 32px max(16px, env(safe-area-inset-left)) 80px max(16px, env(safe-area-inset-right));
    }
    .page-head { margin-bottom: 26px; }
    .page-head h1 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 800; letter-spacing: -0.025em; color: var(--ink); margin-bottom: 6px; }
    .page-head p { font-size: 0.9375rem; color: var(--muted); line-height: 1.5; }

    /* Search row */
    .search-card {
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--line); padding: 20px;
      box-shadow: 0 3px 18px rgba(91,77,255,0.07);
      margin-bottom: 20px;
    }
    .search-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .search-input {
      flex: 1; min-width: 180px; padding: 12px 14px;
      border-radius: var(--radius-sm); border: 1.5px solid rgba(91,77,255,0.2);
      font: inherit; font-size: 1rem; color: var(--ink);
      background: var(--bg); transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none; appearance: none;
    }
    .search-input:focus {
      outline: none; border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(91,77,255,0.12);
      background: #fff;
    }
    .search-input::placeholder { color: var(--muted); }
    .btn-search {
      padding: 12px 22px; border: none; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--brand) 0%, #7c3aed 100%);
      color: #fff; font: inherit; font-size: 0.9375rem; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 3px 14px rgba(91,77,255,0.3);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      display: flex; align-items: center; gap: 7px;
    }
    .btn-search:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(91,77,255,0.35); }
    .btn-search:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-search svg { width: 16px; height: 16px; }
    .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .alert-error {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 15px; border-radius: var(--radius-sm);
      background: rgba(220,38,38,0.07); border: 1px solid rgba(220,38,38,0.22);
      color: #b91c1c; font-size: 0.9rem; line-height: 1.5; margin-top: 12px;
    }
    .alert-error svg { flex-shrink: 0; width: 16px; height: 16px; margin-top: 2px; }

    /* Result card */
    .result-card {
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: 0 6px 28px rgba(91,77,255,0.1);
      overflow: hidden;
      animation: fadeUp 0.35s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .result-header {
      padding: 20px;
      background: linear-gradient(135deg, rgba(91,77,255,0.06), rgba(6,182,212,0.04));
      border-bottom: 1px solid var(--line);
    }
    .result-name { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 4px; }
    .result-rid {
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 0.9rem; color: var(--brand); font-weight: 700;
      background: rgba(91,77,255,0.1); padding: 3px 10px; border-radius: 6px;
      display: inline-block; margin-bottom: 12px;
    }
    .result-meta {
      display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.875rem; color: var(--muted);
    }
    .result-meta span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .result-meta svg { width: 13px; height: 13px; color: var(--brand); flex-shrink: 0; }

    /* Milestones */
    .milestones-section { padding: 20px; }
    .milestones-title {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted); margin-bottom: 14px;
    }
    .milestone {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: var(--radius-sm);
      font-size: 0.9375rem; margin-bottom: 8px;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .milestone:last-child { margin-bottom: 0; }
    .milestone-icon {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .milestone-text { flex: 1; font-weight: 500; color: var(--ink-soft); line-height: 1.35; }
    .milestone-badge {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 3px 8px; border-radius: 6px;
      flex-shrink: 0;
    }

    .m-done { background: rgba(5,150,105,0.06); border-color: rgba(5,150,105,0.15); }
    .m-done .milestone-icon { background: rgba(5,150,105,0.12); }
    .m-done .milestone-text { color: var(--ink); font-weight: 600; }
    .m-done .milestone-badge { background: rgba(5,150,105,0.12); color: var(--success); }

    .m-active { background: rgba(217,119,6,0.06); border-color: rgba(217,119,6,0.2); }
    .m-active .milestone-icon { background: rgba(217,119,6,0.12); }
    .m-active .milestone-badge { background: rgba(217,119,6,0.12); color: var(--warn); }

    .m-issue { background: rgba(220,38,38,0.05); border-color: rgba(220,38,38,0.15); }
    .m-issue .milestone-icon { background: rgba(220,38,38,0.1); }
    .m-issue .milestone-badge { background: rgba(220,38,38,0.1); color: var(--danger); }

    .m-pending { background: var(--bg); border-color: rgba(91,77,255,0.08); }
    .m-pending .milestone-icon { background: rgba(91,77,255,0.08); }
    .m-pending .milestone-text { color: var(--muted); }
    .m-pending .milestone-badge { background: rgba(91,77,255,0.08); color: var(--muted); }

    /* Footer of card */
    .result-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      background: rgba(91,77,255,0.02);
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 10px; justify-content: space-between;
    }
    .result-updated { font-size: 0.8125rem; color: var(--muted); }
    .result-headline { font-size: 0.875rem; color: var(--ink-soft); font-style: italic; margin-top: 2px; }
    .wa-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 700; color: var(--brand); text-decoration: none; padding: 8px 14px; border-radius: 8px; background: rgba(91,77,255,0.08); transition: background 0.15s; white-space: nowrap; }
    .wa-link:hover { background: rgba(91,77,255,0.14); }
    .wa-link svg { width: 15px; height: 15px; }

    /* Not found */
    .not-found {
      text-align: center; padding: 40px 20px;
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--line);
    }
    .not-found .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .not-found h3 { font-size: 1.1rem; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
    .not-found p { font-size: 0.9rem; color: var(--muted); max-width: 36rem; margin: 0 auto; }

    /* Responsive */
    @media (min-width: 600px) {
      .page-wrap { padding-top: 40px; }
      .search-card { padding: 24px; }
      .result-header, .milestones-section, .result-footer { padding: 24px; }
      .milestone { padding: 13px 16px; }
    }
    @media (min-width: 768px) {
      .page-wrap { padding-top: 48px; }
    }
    @media (max-width: 420px) {
      .search-row { flex-direction: column; }
      .btn-search { width: 100%; justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .result-card { animation: none; }
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="NextStep International home">
        <img src="images/logo.webp" width="36" height="36" alt="NextStep International">
        <span class="brand-name">NextStep International</span>
      </a>
      <a class="header-back" href="index.html">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Back
      </a>
    </div>
  </header>

  <div class="page-wrap">
    <div class="page-head">
      <h1>Track your application</h1>
      <p>Enter your <strong>Register ID</strong> (e.g. NSI-2026-001) to see your latest status and milestones.</p>
    </div>

    <div class="search-card">
      <div class="search-row">
        <input type="text" id="rid" class="search-input" placeholder="NSI-2026-001" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Register ID">
        <button type="button" id="go" class="btn-search">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg>
          Check status
        </button>
      </div>
      <div id="err" class="alert-error" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg>
        <span id="err-text"></span>
      </div>
    </div>

    <div id="out" hidden></div>
  </div>

  <script src="js/ns-config.js"></script>
  <script>
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, function (c) {
        return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
      });
    }

    function milestoneClass(s) {
      if (s === "done") return "m-done";
      if (s === "active") return "m-active";
      if (s === "issue") return "m-issue";
      return "m-pending";
    }
    function milestoneIcon(s) {
      if (s === "done") return "✅";
      if (s === "active") return "⏳";
      if (s === "issue") return "❌";
      return "⬜";
    }
    function milestoneBadge(s) {
      if (s === "done") return "Done";
      if (s === "active") return "In progress";
      if (s === "issue") return "Action needed";
      return "Pending";
    }

    function fmtDate(d) {
      if (!d) return "";
      var dt = new Date(d);
      return isNaN(dt.getTime()) ? "" : dt.toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
    }

    var go = document.getElementById("go");
    var ridInput = document.getElementById("rid");
    var errBox = document.getElementById("err");
    var errText = document.getElementById("err-text");
    var out = document.getElementById("out");

    function showErr(msg) {
      errText.textContent = msg;
      errBox.hidden = false;
    }
    function hideErr() { errBox.hidden = true; }

    ridInput.addEventListener("keydown", function (e) { if (e.key === "Enter") go.click(); });

    go.addEventListener("click", async function () {
      var cfg = window.NSI_CONFIG || {};
      var base = String(cfg.apiBase || "").replace(/\/+$/, "");
      hideErr(); out.hidden = true;

      var registrationId = ridInput.value.trim().toUpperCase();
      ridInput.value = registrationId;
      if (!registrationId) { showErr("Please enter your Register ID (e.g. NSI-2026-001)."); ridInput.focus(); return; }
      if (!base) { showErr("API URL not configured. Edit js/ns-config.js and set apiBase to http://localhost:5000."); return; }

      go.disabled = true;
      go.innerHTML = '<span class="spinner"></span> Loading…';

      try {
        var url = base + "/public/website/track?registrationId=" + encodeURIComponent(registrationId);
        var res = await fetch(url);
        var data = await res.json().catch(function () { return {}; });

        if (!res.ok) {
          if (res.status === 404 || (data.error && data.error.toLowerCase().includes("not found"))) {
            out.innerHTML =
              '<div class="not-found">' +
                '<div class="icon">🔍</div>' +
                '<h3>ID not found</h3>' +
                '<p>We couldn\'t find an application with ID <strong>' + esc(registrationId) + '</strong>. Please check the number or contact our team on WhatsApp.</p>' +
              '</div>';
            out.hidden = false;
          } else {
            showErr(data.error || "Error " + res.status);
          }
          go.disabled = false; go.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg> Check status';
          return;
        }

        var milestones = (data.milestones || []).map(function (m) {
          var cls = milestoneClass(m.status);
          return '<div class="milestone ' + cls + '">' +
            '<div class="milestone-icon">' + milestoneIcon(m.status) + '</div>' +
            '<span class="milestone-text">' + esc(m.label) + '</span>' +
            '<span class="milestone-badge">' + milestoneBadge(m.status) + '</span>' +
            '</div>';
        }).join("");

        var metaParts = [];
        if (data.countryInterest) metaParts.push('<span><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' + esc(data.countryInterest) + '</span>');
        if (data.courseInterest) metaParts.push('<span><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>' + esc(data.courseInterest) + '</span>');
        if (data.universityInterest) metaParts.push('<span>' + esc(data.universityInterest) + '</span>');

        out.innerHTML =
          '<div class="result-card">' +
            '<div class="result-header">' +
              '<div class="result-name">' + esc(data.fullName || "—") + '</div>' +
              '<div class="result-rid">' + esc(data.registrationId || "") + '</div>' +
              (metaParts.length ? '<div class="result-meta">' + metaParts.join("") + '</div>' : '') +
            '</div>' +
            (milestones ? '<div class="milestones-section"><div class="milestones-title">Your process status</div>' + milestones + '</div>' : '') +
            '<div class="result-footer">' +
              '<div>' +
                '<div class="result-updated">Last updated: ' + (fmtDate(data.stageUpdatedAt || data.updatedAt) || "—") + '</div>' +
                (data.headline ? '<div class="result-headline">' + esc(data.headline) + '</div>' : '') +
              '</div>' +
              '<a class="wa-link" href="https://wa.me/923142638901" target="_blank" rel="noopener noreferrer">' +
                '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>' +
                'WhatsApp us' +
              '</a>' +
            '</div>' +
          '</div>';
        out.hidden = false;
      } catch (e) {
        showErr("Could not reach the API at " + base + ". Make sure the server is running. (" + (e && e.message ? e.message : "Network error") + ")");
      }

      go.disabled = false;
      go.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg> Check status';
    });

    // Pre-fill from URL param ?id=NSI-...
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id") || params.get("registrationId");
      if (id) { ridInput.value = id; go.click(); }
    })();
  </script>
</body>
</html>
