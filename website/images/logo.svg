<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80" role="img" aria-label="NextStep International">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4a80"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>

  <!-- Icon background: navy rounded square -->
  <rect x="0" y="0" width="80" height="80" rx="16" fill="url(#iconGrad)"/>

  <!-- Ascending steps (gold) — literal "NextStep" metaphor -->
  <rect x="13" y="52" width="14" height="14" rx="3" fill="#e8a020"/>
  <rect x="33" y="39" width="14" height="27" rx="3" fill="#e8a020" opacity="0.88"/>
  <rect x="53" y="26" width="14" height="40" rx="3" fill="#e8a020" opacity="0.75"/>

  <!-- Upward arrow above top step -->
  <path d="M60 22 L67 14 L74 22" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="67" y1="14" x2="67" y2="26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Small "NSI" label inside icon bottom -->
  <text x="40" y="77.5" font-family="Inter,-apple-system,Arial,sans-serif" font-weight="800" font-size="7.5" fill="rgba(255,255,255,0.35)" text-anchor="middle" letter-spacing="3">NSI</text>

  <!-- Wordmark -->
  <!-- "Next" light weight -->
  <text x="96" y="38" font-family="Inter,-apple-system,Arial,sans-serif" font-weight="400" font-size="26" fill="#0f3460" letter-spacing="-0.5">Next</text>
  <!-- "Step" heavy weight -->
  <text x="155" y="38" font-family="Inter,-apple-system,Arial,sans-serif" font-weight="800" font-size="26" fill="#0f3460" letter-spacing="-0.5">Step</text>

  <!-- "International" sub-text -->
  <text x="97" y="58" font-family="Inter,-apple-system,Arial,sans-serif" font-weight="500" font-size="11" fill="#64748b" letter-spacing="4.5">INTERNATIONAL</text>

  <!-- Gold accent underline -->
  <rect x="96" y="63" width="242" height="2.5" rx="1.25" fill="#e8a020"/>
</svg>
